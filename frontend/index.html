<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="大学院の在籍・入学・卒業後データを可視化します" />
  <title>大学院データ可視化</title>
</head>

<body>
  <main>
    <aside class="controls" aria-label="データと表示条件">
      <section>
        <fieldset id="dataset-options" class="radio-list" disabled>
          <legend>データ</legend>
          <p class="loading-text">読み込み中</p>
        </fieldset>
      </section>

      <section class="filters">
        <label for="university">大学</label>
        <select id="university" disabled>
          <option value="">全大学</option>
        </select>

        <label for="graduate-school">研究科</label>
        <select id="graduate-school" disabled>
          <option value="">全研究科</option>
        </select>
      </section>

      <section class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title">表示データ</h2>
        <dl id="summary-values"></dl>
      </section>
    </aside>

    <div class="content">
      <header class="context-bar">
        <div>
          <strong id="scope-label">全大学・全研究科</strong>
          <span id="dataset-description"></span>
        </div>
        <code id="source-file"></code>
      </header>

      <section class="visualization" aria-label="CSV可視化チャート">
        <div id="chart-grid" class="chart-grid"></div>
        <div id="chart-state" class="chart-state" role="status" aria-live="polite">
          <span class="loader" aria-hidden="true"></span>
          <p>読み込み中</p>
        </div>
      </section>

      <footer class="source-note">
        <strong>出典</strong>
        <span>大学ポートレート 2025年度データより抽出</span>
      </footer>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
